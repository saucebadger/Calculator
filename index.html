<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Windows Calculator Millennium Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Windows Calculator Millennium Edition</h1>
    </header>

    <output id="display" aria-label="Calculator display"></output>

    <div id="keypad">
      <button type="button" id="clear">Clear</button>
      <button type="button" data-operator="%" aria-label="Percent of">%</button>
      <button type="button" data-operator="**" aria-label="Raise to power">xʸ</button>

      <button type="button" data-number="7">7</button>
      <button type="button" data-number="8">8</button>
      <button type="button" data-number="9">9</button>
      <button type="button" data-operator="/" aria-label="Divide">÷</button>

      <button type="button" data-number="4">4</button>
      <button type="button" data-number="5">5</button>
      <button type="button" data-number="6">6</button>
      <button type="button" data-operator="*" aria-label="Multiply">×</button>

      <button type="button" data-number="1">1</button>
      <button type="button" data-number="2">2</button>
      <button type="button" data-number="3">3</button>
      <button type="button" data-operator="-" aria-label="Subtract">−</button>

      <button type="button" data-number="0">0</button>
      <button type="button" id="decimal" aria-label="Decimal point">.</button>
      <button type="button" id="equals" aria-label="Equals">=</button>
      <button type="button" data-operator="+" aria-label="Add">+</button>
    </div>
  </main>
</body>
</html>
